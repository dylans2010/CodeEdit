<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{PROJECT_NAME}}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-800 text-white flex items-center justify-center min-h-screen">
  <div x-data="{ count: 0 }" class="text-center">
    <h1 class="text-3xl font-bold mb-4">{{PROJECT_NAME}}</h1>
    <button @click="count++" class="bg-emerald-500 px-4 py-2 rounded font-bold" x-text="'Clicks: ' + count"></button>
  </div>
</body>
</html>
